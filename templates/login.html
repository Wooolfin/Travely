{% extends 'modelo.html' %}
{% block conteudo %}
<link rel="stylesheet" href="../static/styles-login.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

<body>
    <div class="container h-100">
        <div class="row h-100 justify-content-end align-items-center">
            <div class="col-12 col-md-6 col-lg-4 login-container">
                <h2>Entrar</h2>


                <form action="/acesso" method="post" class="content">

                    {% if msg %}
                    <h2 style="color: red;">{{ msg }}</h2>
                    {% endif %}
                        <div class="form-usuario">
                            <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Nome de Usuário" required>
                        </div>
                        <div class="form-senha">
                            <input type="password" name="senha" id="senha" class="form-control" placeholder="Senha"
                                required>
                        </div>
                            <button class="btnGeral" type="submit">Login</button>
                        <div>
                            <button class="btnGeral" type="button" onclick="window.location.href='/cadGuia';">Cadastrar
                                Guia</button>
                        </div>
                        <div>
                            <button class="btnGeral" type="button"
                                onclick="window.location.href='/cadTurista';">Cadastrar Turista</button>
                        </div>
                </form>
            </div>
        </div>
    </div>

</body>
{% endblock %}
