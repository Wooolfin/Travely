<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles-modelo.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    

    <title>Travely</title>
</head>

<body>
    <header>
        <div class="d-flex justify-content-center w-100">
            <div class="logo">
                <a href="/">
                    <img src="../static/images/logo.png">
                </a>
            </div>
        </div>
        <button id="toggle-btn" class="toggle-btn justify-content-between me-5">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-layout-text-sidebar" viewBox="0 0 16 16">
                <path d="M3.5 3a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zm0 3a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM3 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1z"/>
                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm12-1v14h2a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm-1 0H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h9z"/>
              </svg>
        </button>
    </header>
    
    {% if tipo %}
    <section>
        <div id="sidebar" class="sidebar">
            <div class="iconeUser">
                <a href="/listaPasseios">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" class="iconUsuario" fill="currentColor" style="color: #5E4333;" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                      </svg>
                </a>
            <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </section>
    {% else %}
    <section>
        <div id="sidebar" class="sidebar">
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </section>
    {% endif %}

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <footer>
        <div class="footer-content container">
            <div class="row">
                    <div class="footer-image col-12 col-md-3">
                    <img src="../static/images/Logo-Travely.png" alt="Travely Logo" class="img-fluid">
                </div>
    
                <div class="footer-buttons col-16 col-md-9">
                    <div class="row">
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/cadGuia';">Cadastro Guia</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/cadPasseio';">Cadastrar Passeio</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/cadTurista';">Cadastro Turista</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/detalhes';">Sobre o Travely</button>
                        </div>
    
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/adm';">Administrador</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/home';">Página Home</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/listaPasseios';">Lista dos Passeios</button>
                        </div>
                        <div class="col-6 col-md-3 mb-3">
                            <button onclick="window.location.href='/login';">Fazer login</button>
                        </div>
                        <div>
                            <p>© 2024 TCC Etec, Inc.</p>
                        </div>
                    </div>
                </div>
            </div>
        {% if tipo %}
        <a class="iptadm" style="color: white;" href="/login">Acesso ao administrador</a>
        {% else %}
        {% endif %}
    </footer>

    <script>
        const toggleButton = document.getElementById("toggle-btn");
        const sidebar = document.getElementById("sidebar");

        sidebar.style.width = "0";
    
        toggleButton.addEventListener("click", function () {
            if (sidebar.style.width === "170px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "170px";
            }
        });
    </script>
</body>

</html>
